[package]
name = "nearling-contract"
description = "Nearling: an AI pet as an NFT on NEAR"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"
# `repository` is added at R1: SourceScan and the reproducible build clone the game's public repo from it.

[lib]
crate-type = ["cdylib", "rlib"]

# WASM reproducibility fields, as `cargo near new` of cargo-near 0.22.0 writes them
# (https://github.com/near/NEPs/blob/master/neps/nep-0330.md).
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = "=5.30.0"
near-contract-standards = "=5.30.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
near-workspaces = "=0.24.0"
cargo-near-build = "=0.11.5"
tokio = { version = "=1.54.1", features = ["full"] }
serde_json = "=1.0.154"
anyhow = "=1.0.104"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
